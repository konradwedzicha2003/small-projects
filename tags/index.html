<!DOCTYPE html>
<html lang="pl">
<head>
    <title>Tags</title>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300&display=swap" rel="stylesheet">
</head>
<body>
<main class="main-container">
    <form class="search" id="search">
        <input class="search__input" type="search" name="filter">
    </form>
    <div class="selected-tags-list">
        <div class="number-of-selected-tags">Tags 0</div>
        <div class="selected-tags-list__inner">
            <p>Selected tags:</p>
            <div class="selected-tags-list-element hidden" data-tag-content="html">
                <div class="selected-tags-list-element__inner">
                    <img class="remove-img" src="assests/remove.png" alt="#">
                    <p>html</p>
                </div>
            </div>
            <div class="selected-tags-list-element hidden" data-tag-content="css">
                <div class="selected-tags-list-element__inner">
                    <img class="remove-img" src="assests/remove.png" alt="#">
                    <p>css</p>
                </div>
            </div>
            <div class="selected-tags-list-element hidden" data-tag-content="js">
                <div class="selected-tags-list-element__inner">
                    <img class="remove-img" src="assests/remove.png" alt="#">
                    <p>js</p>
                </div>
            </div>
            <div class="selected-tags-list-element hidden" data-tag-content="react">
                <div class="selected-tags-list-element__inner">
                    <img class="remove-img" src="assests/remove.png" alt="#">
                    <p>react</p>
                </div>
            </div>
            <div class="selected-tags-list-element hidden" data-tag-content="php">
                <div class="selected-tags-list-element__inner">
                    <img class="remove-img" src="assests/remove.png" alt="#">
                    <p>php</p>
                </div>
            </div>
            <div class="selected-tags-list-element hidden" data-tag-content="c++">
                <div class="selected-tags-list-element__inner">
                    <img class="remove-img" src="assests/remove.png" alt="#">
                    <p>c++</p>
                </div>
            </div>
            <div class="selected-tags-list-element hidden" data-tag-content="vue">
                <div class="selected-tags-list-element__inner">
                    <img class="remove-img" src="assests/remove.png" alt="#">
                    <p>vue</p>
                </div>
            </div>
            <div class="selected-tags-list-element hidden" data-tag-content="c">
                <div class="selected-tags-list-element__inner">
                    <img class="remove-img" src="assests/remove.png" alt="#">
                    <p>c</p>
                </div>
            </div>
            <div class="selected-tags-list-element hidden" data-tag-content="xd">
                <div class="selected-tags-list-element__inner">
                    <img class="remove-img" src="assests/remove.png" alt="#">
                    <p>xd</p>
                </div>
            </div>
            <div class="selected-tags-list-element hidden" data-tag-content="adhd">
                <div class="selected-tags-list-element__inner">
                    <img class="remove-img" src="assests/remove.png" alt="#">
                    <p>adhd</p>
                </div>
            </div>
            <div class="selected-tags-list-element hidden" data-tag-content="1234">
                <div class="selected-tags-list-element__inner">
                    <img class="remove-img" src="assests/remove.png" alt="#">
                    <p>1234</p>
                </div>
            </div>
        </div>
    </div>
    <div class="tag-box">
        <div class="tag-box__inner">
            <div class="tag">html</div>
            <div class="tag">css</div>
            <div class="tag">js</div>
            <div class="tag">react</div>
            <div class="tag">php</div>
            <div class="tag">c++</div>
            <div class="tag">vue</div>
            <div class="tag">c</div>
            <div class="tag">xd</div>
            <div class="tag">adhd</div>
            <div class="tag">1234</div>
            <button class="show-more-or-less">Show more</button>
        </div>

    </div>
</main>

<script src="scripts.js"></script>
</body>
</html>
